# Perfil SO para a demonstracao local do criterio de aceite da Fase 4:
# editar uma linha de log_seguranca a mao pelo console H2 e ver
# GET /api/admin/auditoria/verificar-integridade apontar aquele log_id.
#
#   SPRING_PROFILES_ACTIVE=console-h2 mvn -pl apresentacao-backend spring-boot:run
#   http://localhost:8080/h2-console  (JDBC URL jdbc:h2:file:./sigea, usuario sa, senha vazia)
#
# O console executa SQL arbitrario no banco. Ele fica desligado no
# application.properties e nunca deve ser ativado no Railway. O padrao do
# Spring ja recusa conexoes que nao venham de localhost
# (spring.h2.console.settings.web-allow-others=false); fica explicito aqui.
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
