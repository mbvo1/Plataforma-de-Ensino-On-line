spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./sigea
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Directory where uploaded files will be stored (relative to application
# working directory)
file.upload-dir=uploads

# Limite explicito de tamanho de upload (V-05) - antes dependia do default
# implicito do Spring Boot (1MB/10MB), sem nenhuma declaracao aqui.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

jwt.secret=${JWT_SECRET}
gemini.api.key=${GEMINI_API_KEY}
cpf.encryption.key=${CPF_ENCRYPTION_KEY}

server.port=${PORT:8080}